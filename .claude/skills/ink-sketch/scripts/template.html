<!doctype html>
<!--
  ink-sketch template. Copy this file, edit CONFIG + the COMPOSE section, then
  render to PNG with scripts/render.sh (pass the SAME width/height as CONFIG).
  Everything is drawn with the helper library below; you only write the scene.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper, #f4f1ea);
      }
      #wrap {
        background: var(--paper, #f4f1ea);
      }
    </style>
  </head>
  <body>
    <div id="wrap"><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <script>
      /* ===================== CONFIG ===================== */
      const CONFIG = {
        W: 1200, // canvas width  (pass to render.sh)
        H: 800, // canvas height (pass to render.sh)
        paper: "#f4f1ea", // off-white paper
        ink: "#17130d", // near-black ink
        wobble: 6, // roughen displacement (4 tight … 9 loose)
        grain: 0.016, // roughen frequency (0.010 coarse … 0.02 fine)
        seed: 9, // change for a different hand
      };

      /* ============ engine + mark library ============== */
      const NS = "http://www.w3.org/2000/svg";
      const wrap = document.getElementById("wrap");
      const art = document.getElementById("art");
      document.documentElement.style.setProperty("--paper", CONFIG.paper);
      wrap.style.width = CONFIG.W + "px";
      wrap.style.height = CONFIG.H + "px";
      art.setAttribute("width", CONFIG.W);
      art.setAttribute("height", CONFIG.H);
      art.setAttribute("viewBox", `0 0 ${CONFIG.W} ${CONFIG.H}`);
      art.innerHTML = `<defs>
        <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="${CONFIG.grain}" numOctaves="2" seed="${CONFIG.seed}" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="${CONFIG.wobble}" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g id="ink" filter="url(#rough)" fill="none" stroke="${CONFIG.ink}"
         stroke-linecap="round" stroke-linejoin="round"></g>`;
      const ink = art.querySelector("#ink");

      // deterministic RNG so a scene renders identically every time
      let _s = (CONFIG.seed * 2654435761) >>> 0;
      const rnd = () => ((_s = (_s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      const rr = (a, b) => a + (b - a) * rnd();
      const setSeed = (n) => (_s = (n * 2654435761) >>> 0);

      // raw stroke. w = width, o = extra attributes ({}).
      function P(d, w = 3, o) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.setAttribute("stroke-width", w);
        if (o) for (const k in o) p.setAttribute(k, o[k]);
        ink.appendChild(p);
        return p;
      }
      const line = (x0, y0, x1, y1, w = 3) => P(`M${x0} ${y0} L${x1} ${y1}`, w);
      const curve = (x0, y0, cx, cy, x1, y1, w = 3) =>
        P(`M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}`, w);
      // open or closed polyline through points [[x,y],...]
      function poly(pts, w = 3, close = false) {
        let d = `M${pts[0][0]} ${pts[0][1]}`;
        for (let i = 1; i < pts.length; i++) d += ` L${pts[i][0]} ${pts[i][1]}`;
        if (close) d += " Z";
        return P(d, w);
      }

      // loose daisy / wildflower: radiating tapered petals + a center scribble
      function bloom(cx, cy, size, n = 8, w = 2) {
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rr(-0.16, 0.16);
          const r1 = size * rr(0.72, 1.12);
          const mx = cx + Math.cos(a) * r1 * 0.55,
            my = cy + Math.sin(a) * r1 * 0.55;
          const ex = cx + Math.cos(a) * r1,
            ey = cy + Math.sin(a) * r1;
          const pa = a + Math.PI / 2,
            pw = size * 0.16;
          P(
            `M${cx + Math.cos(a) * size * 0.14} ${cy + Math.sin(a) * size * 0.14}` +
              ` Q${mx + Math.cos(pa) * pw} ${my + Math.sin(pa) * pw} ${ex} ${ey}` +
              ` Q${mx - Math.cos(pa) * pw} ${my - Math.sin(pa) * pw} ${cx - Math.cos(a) * size * 0.1} ${cy - Math.sin(a) * size * 0.1}`,
            w,
          );
        }
        P(`M${cx - size * 0.12} ${cy} q${size * 0.12} ${-size * 0.14} ${size * 0.24} 0 q${-size * 0.12} ${size * 0.14} ${-size * 0.24} 0`, w + 0.2);
      }

      // round, cloud-like blossom (roses / peonies): overlapping bumps
      function blossom(cx, cy, size, bumps = 7, w = 2.4) {
        let d = `M${cx + size} ${cy}`;
        for (let i = 1; i <= bumps; i++) {
          const a = (i / bumps) * Math.PI * 2;
          const r = size * rr(0.85, 1.15);
          const ma = a - Math.PI / bumps;
          const mr = size * 1.35;
          d += ` Q${cx + Math.cos(ma) * mr} ${cy + Math.sin(ma) * mr} ${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}`;
        }
        return P(d + " Z", w);
      }

      // a single leaf (pointed almond) anchored at x,y, pointing at angle (rad)
      function leaf(x, y, angle, len, w = 2.2) {
        const ex = x + Math.cos(angle) * len,
          ey = y + Math.sin(angle) * len;
        const pa = angle + Math.PI / 2,
          bw = len * 0.28;
        const mx = x + Math.cos(angle) * len * 0.5,
          my = y + Math.sin(angle) * len * 0.5;
        return P(
          `M${x} ${y} Q${mx + Math.cos(pa) * bw} ${my + Math.sin(pa) * bw} ${ex} ${ey}` +
            ` Q${mx - Math.cos(pa) * bw} ${my - Math.sin(pa) * bw} ${x} ${y} Z`,
          w,
        );
      }

      // stem with a few alternating leaves
      function sprig(x, y, angle, len, w = 2.2) {
        const ex = x + Math.cos(angle) * len,
          ey = y + Math.sin(angle) * len;
        const bend = rr(-len * 0.25, len * 0.25);
        curve(x, y, (x + ex) / 2 + bend, (y + ey) / 2, ex, ey, w);
        const nL = 3 + Math.floor(rnd() * 2);
        for (let i = 1; i <= nL; i++) {
          const t = i / (nL + 1);
          const lx = x + (ex - x) * t,
            ly = y + (ey - y) * t;
          const side = i % 2 ? 1 : -1;
          leaf(lx, ly, angle + side * rr(0.7, 1.0), len * rr(0.14, 0.22), w * 0.9);
        }
      }

      // scribble/hatch fill inside an axis box — shading, foliage mass, a lit window
      function hatch(x, y, w, h, gap = 9, sw = 1.6) {
        for (let o = -h; o < w; o += gap) {
          const x0 = Math.max(x, x + o),
            y0 = o < 0 ? y - o : y;
          const x1 = Math.min(x + w, x + o + h),
            y1 = o + h > w ? y + (w - o) : y + h;
          if (x1 > x0) line(x0, y0 + rr(-2, 2), x1, y1 + rr(-2, 2), sw);
        }
      }

      // rough rounded-rect outline (frames, screens, boxes)
      function box(x, y, w, h, r = 10, sw = 4) {
        return P(
          `M${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r}` +
            ` L${x + w} ${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h}` +
            ` L${x + r} ${y + h} Q${x} ${y + h} ${x} ${y + h - r}` +
            ` L${x} ${y + r} Q${x} ${y} ${x + r} ${y} Z`,
          sw,
        );
      }

      // tiny gray index label like the reference sheet ([1], [2], …). Not inked
      // (drawn crisp, outside the roughen filter).
      function label(x, y, t) {
        const e = document.createElementNS(NS, "text");
        e.setAttribute("x", x);
        e.setAttribute("y", y);
        e.setAttribute("font-family", "Helvetica, Arial, sans-serif");
        e.setAttribute("font-size", 15);
        e.setAttribute("fill", "#8f8d88");
        e.textContent = t;
        art.appendChild(e);
        return e;
      }

      /* ===================== COMPOSE ===================== */
      /* Replace everything below with your scene. Keep objects isolated with
         generous negative space; vary stroke width (contours ~5-7, details
         ~2-3); let lines slightly overshoot at corners for a hand-drawn feel. */

      // vase of wildflowers
      label(150, 250, "[1]");
      P("M330 640 q-22 -60 6 -128 q8 -18 -6 -34 l128 0 q-14 16 -6 34 q30 68 6 128 q-68 34 -128 0 z", 6.5);
      curve(250, 650, 420, 672, 590, 650, 5.5); // table line
      const tips = [[300, 300], [404, 250], [500, 286], [560, 392], [250, 420], [556, 470]];
      tips.forEach((t) => curve(394 + rr(-16, 16), 494, 400 + (t[0] - 400) * 0.4, 380, t[0], t[1], 2.4));
      tips.forEach((t, i) => bloom(t[0], t[1], rr(30, 42), i % 2 ? 7 : 8));

      // coffee cup
      label(760, 250, "[2]");
      curve(840, 560, 965, 600, 1090, 560, 5); // saucer
      P("M878 470 q6 70 86 74 q80 -4 86 -74", 6); // cup body
      curve(868, 466, 972, 500, 1076, 466, 5.5); // rim
      P("M1058 480 q46 4 40 44 q-6 30 -40 24", 4.5); // handle
      P("M930 430 q-14 -22 4 -40 q16 -18 2 -40", 2.4); // steam
      P("M980 424 q-14 -22 4 -40 q16 -18 2 -40", 2.4);
    </script>
  </body>
</html>
