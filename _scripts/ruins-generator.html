<!doctype html><html><head><style>html,body{margin:0;background:transparent}</style></head><body>
<svg id="art" width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="stone" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="fine"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="coarse"/>
    <feComposite in="fine" in2="coarse" operator="arithmetic" k1="0" k2="0.55" k3="0.45" k4="0" result="mix"/>
    <feDiffuseLighting in="mix" lighting-color="#efe9dd" surfaceScale="2.6" diffuseConstant="1.05" result="lit">
      <feDistantLight azimuth="235" elevation="55"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="chip" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
  </filter>
</defs>
<g id="blueprint"></g>
<g id="scatter"></g>
<g id="ruin" filter="url(#chip)">
  <g id="stones" filter="url(#stone)"></g>
  <g id="joints" stroke="#4a4238" stroke-width="2.4" opacity="0.5" fill="none"></g>
  <g id="shade" fill="#3a332b" opacity="0.16"></g>
  <g id="tone"></g>
  <g id="cracks" stroke="#3a332b" stroke-width="1.6" opacity="0.5" fill="none"></g>
</g>

</svg>
<script>
const NS="http://www.w3.org/2000/svg";
const Q = new URLSearchParams(location.search);
const V = Q.get("v") || "home";
let s = 42 + V.length*7; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
const rr=(a,b)=>a+(b-a)*rnd();
const g=id=>document.getElementById(id);
function el(parent,tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);g(parent).appendChild(e);return e;}
const P=(parent,d,extra)=>el(parent,"path",Object.assign({d},extra||{}));
const R=(parent,x,y,w,h,extra)=>el(parent,"rect",Object.assign({x,y,width:w,height:h},extra||{}));

/* ---- shared pieces ---- */
// masonry courses with joints + random per-block tone
function courses(x,y,w,h,rows){
  R("stones",x,y,w,h);
  const rh=h/rows;
  for(let r=1;r<rows;r++) P("joints",`M${x} ${y+r*rh} L${x+w} ${y+r*rh}`);
  for(let r=0;r<rows;r++){
    const off=(r%2? w*0.33: w*0.6);
    if(w>90) P("joints",`M${x+off} ${y+r*rh} L${x+off} ${y+(r+1)*rh}`);
    if(rnd()<0.45) R("tone",x+(r%2?0:w*0.5),y+r*rh,w*0.5,rh,{fill:"#8a7f6f",opacity:rr(0.05,0.14)});
  }
  R("shade",x,y,Math.min(20,w*0.16),h);
}
// round arch on two piers; broken=true knocks a bite from the crown
function archway(cx,springY,innerR,thick,pierH,broken){
  const oR=innerR+thick, pw=thick*1.15;
  const x0=cx-oR, x1=cx+oR;
  courses(x0,springY,pw,pierH,Math.max(3,Math.round(pierH/95)));
  courses(x1-pw,springY,pw,pierH,Math.max(3,Math.round(pierH/95)));
  R("stones",x0-14,springY-40,pw+28,42); R("stones",x1-pw-14,springY-40,pw+28,42);
  if(broken){
    // arch drawn in two fragments with a jagged gap left of crown
    P("stones",`M${x0} ${springY} A ${oR} ${oR} 0 0 1 ${cx-oR*0.30} ${springY-oR*0.94}
      L ${cx-oR*0.22} ${springY-oR*0.80} L ${cx-innerR*0.32} ${springY-innerR*0.95}
      A ${innerR} ${innerR} 0 0 0 ${cx-innerR} ${springY} Z`);
    P("stones",`M${cx-oR*0.12} ${springY-oR*0.985} A ${oR} ${oR} 0 0 1 ${x1} ${springY}
      L ${cx+innerR} ${springY} A ${innerR} ${innerR} 0 0 0 ${cx-innerR*0.10} ${springY-innerR*0.99}
      L ${cx-oR*0.05} ${springY-oR*0.86} Z`);
    // fallen voussoir on the ground
    el("stones","g",{}); const fb=el("stones","path",{d:`M${cx-innerR*0.55} ${springY+pierH-58} l86 -22 l30 52 l-90 26 z`});
    P("joints",`M${cx-innerR*0.55+40} ${springY+pierH-66} l14 52`,{opacity:0.4});
  } else {
    P("stones",`M${x0} ${springY} A ${oR} ${oR} 0 0 1 ${x1} ${springY} L ${cx+innerR} ${springY} A ${innerR} ${innerR} 0 0 0 ${cx-innerR} ${springY} Z`);
  }
  // voussoir joints
  for(let a=20;a<=160;a+=20){
    const rad=a*Math.PI/180;
    P("joints",`M${cx-Math.cos(rad)*innerR} ${springY-Math.sin(rad)*innerR} L${cx-Math.cos(rad)*oR} ${springY-Math.sin(rad)*oR}`);
  }
  // intrados shading band (thin, hugging inner edge, stopping above spring)
  P("shade",`M${cx-innerR*0.94} ${springY-innerR*0.34} A ${innerR} ${innerR} 0 0 1 ${cx+innerR*0.94} ${springY-innerR*0.34}
    A ${innerR*0.9} ${innerR*0.9} 0 0 0 ${cx-innerR*0.94} ${springY-innerR*0.34} Z`);
  for(let i=0;i<3;i++){
    const px=cx+rr(-oR,oR), py=springY-rr(0,oR*0.7);
    P("cracks",`M${px} ${py} l${rr(-8,18)} ${rr(10,24)} l${rr(-14,6)} ${rr(8,20)}`);
  }
}
// fluted column; brokenTop=true gives jagged top; returns top y
function column(cx,baseY,w,h,brokenTop){
  const x=cx-w/2;
  if(brokenTop){
    P("stones",`M${x} ${baseY} L${x} ${baseY-h} l${w*0.2} ${h*0.06} l${w*0.22} ${-h*0.12} l${w*0.2} ${h*0.05} l${w*0.18} ${-h*0.07} L${x+w} ${baseY} Z`);
  } else {
    R("stones",x,baseY-h,w,h);
    R("stones",x-10,baseY-h-26,w+20,28); // capital
    P("stones",`M${x-8} ${baseY-h-26} q${w/2+8} ${-26} ${w+16} 0`);
  }
  R("stones",x-12,baseY,w+24,26); // plinth
  for(let f=1;f<5;f++) P("joints",`M${x+f*w/5} ${baseY-4} L${x+f*w/5} ${baseY-h*(brokenTop?0.82:0.97)}`,{opacity:0.35});
  for(let d=1;d<Math.round(h/110);d++) P("joints",`M${x} ${baseY-d*110} L${x+w} ${baseY-d*110}`);
  R("shade",x,baseY-h,w*0.2,h);
  return baseY-h;
}
function drum(cx,cy,rxx,ryy,angle){ // fallen column section
  el("stones","ellipse",{cx,cy,rx:rxx,ry:ryy,transform:`rotate(${angle} ${cx} ${cy})`});
  el("shade","ellipse",{cx:cx,cy:cy+ryy*0.34,rx:rxx*0.92,ry:ryy*0.5,transform:`rotate(${angle} ${cx} ${cy})`});
}
/* ---- decorative layers ---- */
function scatter(words,x0,y0,x1,y1,n){
  for(let i=0;i<n;i++){
    const t=el("scatter","text",{x:rr(x0,x1),y:rr(y0,y1),"font-family":"'Liberation Mono','DejaVu Sans Mono',monospace",
      "font-size":rr(13,19),fill:(rnd()<0.16?"#8f8fc4":"#7a7166"),opacity:rr(0.28,0.5),"letter-spacing":"2"});
    t.textContent=words[Math.floor(rnd()*words.length)];
  }
}
function blueprint(kind){
  const st={fill:"none",stroke:"#6b6055",opacity:0.12,"stroke-width":1.4};
  if(kind==="circuit"){
    R("blueprint",880,60,420,300,Object.assign({rx:14},st));
    R("blueprint",930,110,180,120,st); R("blueprint",1140,110,110,200,st);
    el("blueprint","circle",Object.assign({cx:1000,cy:300,r:34},st));
    for(let i=0;i<8;i++) P("blueprint",`M${900+i*24} 60 v-22`,st);
    P("blueprint",`M880 200 h-60 M1300 160 h48`,st);
  } else if(kind==="dims"){
    P("blueprint",`M120 120 h420 M120 112 v16 M540 112 v16`,st);
    el("blueprint","circle",Object.assign({cx:330,cy:330,r:150},st));
    el("blueprint","circle",Object.assign({cx:330,cy:330,r:96},st));
    P("blueprint",`M330 160 v340 M160 330 h340`,st);
  } else if(kind==="grid"){
    for(let i=0;i<5;i++) P("blueprint",`M${940+i*80} 80 v260`,st);
    for(let i=0;i<4;i++) P("blueprint",`M940 ${80+i*86} h320`,st);
    P("blueprint",`M940 80 l320 260`,st);
  }
}
/* ---- variants ---- */
if(V==="home"){
  blueprint("circuit");
  scatter(["BAYES","ARGMAX","TIME SERIES","CAUSAL","SIGMA","A/B","PRIOR","POSTERIOR","THETA","MCMC"],560,300,1060,760,26);
  archway(700,560,210,90,380,true);
}
if(V==="blog"){
  blueprint("dims");
  scatter(["DRAFT","REV 02","PUBLISHED","$ mollify audit","EXIT 0","TODO","EDIT","1,240 WORDS"],420,260,1080,700,22);
  const top=column(980,940,110,560,true);
  P("stones",`M620 866 L790 876 L786 936 L616 926 Z`);
  el("stones","ellipse",{cx:620,cy:896,rx:26,ry:31,transform:"rotate(-4 620 896)"});
  P("joints",`M655 869 L652 929 M718 872 L715 932`,{opacity:0.4});
  R("shade",616,914,172,14,{opacity:0.2});
  P("stones",`M450 902 L560 908 L557 948 L447 942 Z`);
  el("stones","ellipse",{cx:450,cy:922,rx:18,ry:21,transform:"rotate(-4 450 922)"});
  // stone stele with faint inscription lines
  R("stones",180,640,240,300); R("stones",165,610,270,36);
  for(let i=0;i<7;i++) P("joints",`M210 ${690+i*32} h180`,{opacity:0.3,"stroke-width":1.6});
  R("shade",180,640,26,300);
}
if(V==="projects"){
  blueprint("grid");
  scatter(["CARGO","BUILD OK","v0.1.0","MERGE","PIPELINE","DETERMINISTIC","RELEASE","CI PASS"],320,240,1150,660,24);
  archway(320,640,120,56,300,false);
  archway(700,640,120,56,300,true);
  archway(1080,640,120,56,300,false);
  P("stones",`M120 640 L1290 640 L1290 600 L120 600 Z`); // architrave tying the arcade
}
if(V==="academic"){
  blueprint("dims");
  scatter(["LEMMA 2.1","PROOF","Q.E.D.","THM 3.2","p. 47","COROLLARY","AXIOM","DEF 1.4"],420,240,1120,620,22);
  // pediment with broken right corner
  P("stones",`M330 560 L700 380 L1010 530 L1046 560 Z`);
  P("joints",`M380 552 L700 396 L1000 542`);
  R("stones",350,566,700,44); // architrave
  P("joints",`M350 588 h700`,{opacity:0.35});
  const xs=[420,610,800,990];
  xs.forEach((x,i)=> i===2 ? column(x,940,92,300,true) : column(x,940,92,330,false));
  R("stones",340,940,720,30); // stylobate
}
if(V==="books"){
  blueprint("circuit");
  scatter(["FOLIO","CH. XI","EX LIBRIS","PLATE IV","MMXXVI","INDEX","VOL. 2","COLOPHON"],380,260,1120,680,22);
  // wall with two arched niches (shelf-like)
  R("stones",260,480,760,460);
  P("shade",`M370 940 L370 660 A 120 120 0 0 1 610 660 L610 940 Z`,{opacity:0.5});
  P("shade",`M690 940 L690 660 A 120 120 0 0 1 930 660 L930 940 Z`,{opacity:0.5});
  P("shade",`M370 940 L370 660 A 120 120 0 0 1 610 660 L610 700 A 96 96 0 0 0 410 700 L410 940 Z`,{opacity:0.32});
  P("shade",`M690 940 L690 660 A 120 120 0 0 1 930 660 L930 700 A 96 96 0 0 0 730 700 L730 940 Z`,{opacity:0.32});
  for(let r=1;r<6;r++) P("joints",`M260 ${480+r*77} h760`,{opacity:0.4});
  P("joints",`M370 940 L370 660 A 120 120 0 0 1 610 660 L610 940 M690 940 L690 660 A 120 120 0 0 1 930 660 L930 940`);
  // fallen capital in front
  P("stones",`M1080 900 l110 -18 l26 44 l-112 22 z`);
  drum(1170,860,60,26,-12);
}
</script>
</body></html>
