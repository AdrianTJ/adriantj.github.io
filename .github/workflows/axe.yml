name: Build, links, and accessibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip install -r requirements.txt -r requirements-test.txt
          npm ci
          python -m playwright install --with-deps chromium
      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check local links, markup, and content
        run: python _scripts/test_site.py
      - name: Check accessibility and responsive interactions
        run: |
          python -m http.server 4000 --bind 127.0.0.1 --directory _site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null; then break; fi
            sleep 1
          done
          python _scripts/test_browser.py
